# PRIME-Factory v2.2 — Mosquitto Broker Configuration
listener 1883 0.0.0.0
allow_anonymous true

# Persistence (تم تعديل المسار ليكون جوه المشروع)
persistence true
persistence_location C:/prime-factory/data/

# Logging (تم تعديل المسار ليكون جوه المشروع)
log_dest stdout
log_dest file C:/prime-factory/logs/mosquitto.log
log_type error
log_type warning
log_type notice
log_type information
connection_messages true
log_timestamp true
log_timestamp_format %Y-%m-%dT%H:%M:%S

# Limits
max_connections 50
max_packet_size 1048576